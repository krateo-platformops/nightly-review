# Checks config.destinations.components against the installer's pins (krateo-platformops/installer,
# chart/files/component-pins.yaml on main). Its own job because it needs the network and is about another
# repository's state: a failure here means "the map is stale", not "this change broke the service".
#
# DAILY AS WELL AS ON EVERY CHANGE. What drifts is the installer: a new pin there opens no pull request
# here, so a check that ran only on this repo's changes would find it on the next unrelated PR, if ever.
# A failed fetch FAILS the job (destinations_drift.fetch raises) — a check that passes when GitHub is
# unreachable is a check that passes.
name: drift

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destinations-vs-installer-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir pytest==8.3.3 requests==2.32.3 PyYAML==6.0.2
      - name: Destinations agree with the installer's pins
        # -rA prints the assertion's list of what to add even when the summary is all you read.
        run: python -m pytest drift/ -q -rA
