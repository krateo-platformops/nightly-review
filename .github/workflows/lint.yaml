# Krateo chart-repo lint workflow, from krateo-agentiko/model-configs (the Documentation Standard
# job is omitted: this repo has no docs/ tree). Before it, nothing here linted or rendered the charts
# except render-test.yaml's two focused tests. PR-time validation for every chart in
# the repo — helm lint, values.schema.json well-formedness, and a render smoke test.
# Shape-agnostic: discovers chart/, crds-subchart/, helm/* and charts/* (vendored dependency
# charts sit deeper and are skipped). Identical across all krateo-* chart repos.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Pull a private chart dependency (oci://ghcr.io/krateo-agentiko/charts/...) with the job's own
  # token rather than a long-lived PAT. GitHub gives Dependabot runs no Actions secrets, so a PAT
  # login failed every Dependabot PR with 403. A repo whose chart depends on krateo-agent-lib also
  # needs that package to grant it read access (package settings, Manage Actions access).
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Lint, validate schema, render
        run: |
          set -euo pipefail
          # measured 2026-11-28: 2 chart(s) (helm/nightly-review, helm/nightly-review-crds); lower only when a chart is deliberately removed
          MIN_CHARTS=2
          # All first-class charts (chart/, crds-subchart/, helm/*, charts/*). Vendored dependency
          # charts live at depth >=4 (e.g. charts/x/charts/dep), so -maxdepth 3 excludes them.
          mapfile -t dirs < <(find . -maxdepth 3 -name Chart.yaml -printf '%h\n' | sort -u)
          if [ "${#dirs[@]}" -lt "${MIN_CHARTS}" ]; then echo "::error::examined ${#dirs[@]} chart(s), expected at least ${MIN_CHARTS}"; exit 1; fi
          echo "examined ${#dirs[@]} chart(s): ${dirs[*]}"
          fail=0
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            # Placeholder versions used by the release workflow must not break lint.
            sed -i 's/CHART_VERSION/0.0.0/g; s/APP_VERSION/0.0.0/g' "${dir}/Chart.yaml"
            if [ -f "${dir}/values.schema.json" ]; then
              python3 -c "import json; json.load(open('${dir}/values.schema.json'))" \
                && echo "values.schema.json: valid JSON" || { echo "values.schema.json: INVALID"; fail=1; }
            fi
            if grep -q '^dependencies:' "${dir}/Chart.yaml"; then
              helm dependency build "${dir}" >/dev/null 2>&1 || helm dependency update "${dir}" >/dev/null 2>&1 \
                || { echo "${dir}: chart dependencies could not be fetched"; fail=1; }
            fi
            helm lint "${dir}" || fail=1
            helm template smoke "${dir}" >/dev/null || fail=1
            echo "::endgroup::"
          done
          exit $fail
