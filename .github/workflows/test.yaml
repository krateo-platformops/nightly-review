# Runs the test suite on every pull request and every push to main.
#
# THE WORKFLOW IS THE POINT, NOT THE TESTS. frontend#334 is the cautionary case: 1891 tests sat in that
# repo while three regressions shipped on one code path, because nothing ever executed them. A control
# nobody runs is a comment, and that applies as much to an allowlist check as to a lint rule.
#
# The suite includes the Python-parity fixtures (internal/parity, internal/pyyaml): fingerprints,
# subjects, redaction, prompts and validation messages computed by the last Python service, asserted
# byte for byte. A failure there means existing Proposal CRs would stop matching.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./... && go vet -tags drift ./drift/
      - name: Test
        run: |
          set -euo pipefail
          go test -count=1 -v ./... 2>&1 | tee /tmp/go-test.log
      # `go test ./...` passes vacuously if packages stop being collected. Count `--- PASS` (not
      # `=== RUN`, so skipped tests do not count), subtests included.
      #   observed healthy run   381   (go test -count=1 -v ./..., 2026-11-28; 1 skip, 0 fail)
      #   floor                  320   about 15% under, so losing a file contributing more than ~60
      #                                passes fails, while ordinary churn does not
      # Raise it when the suite grows; a floor that never moves stops meaning anything.
      - name: assert the suite actually ran tests
        run: |
          set -euo pipefail
          count=$(grep -c -- '--- PASS' /tmp/go-test.log || true)
          echo "tests passed: $count (observed healthy run: 381)"
          if [ "$count" -lt 320 ]; then
            echo "::error::only $count tests passed, floor is 320 - a suite that collects little or nothing passes vacuously"
            exit 1
          fi
      - name: public text
        run: hack/check-public-text.sh
