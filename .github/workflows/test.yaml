# Runs the test suite on every pull request and every push to main.
#
# THE WORKFLOW IS THE POINT, NOT THE TESTS. frontend#334 is the cautionary case: 1891 tests sat in that
# repo while three regressions shipped on one code path, because nothing ever executed them. A control
# nobody runs is a comment, and that applies as much to an allowlist check as to a lint rule.
#
# The suite includes the Python-parity fixtures (internal/parity, internal/pyyaml): fingerprints,
# subjects, redaction, prompts and validation messages computed by the last Python service, asserted
# byte for byte. A failure there means existing Proposal CRs would stop matching.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./... && go vet -tags drift ./drift/
      - name: Test
        run: go test ./...
