# A Proposal is a DECISION RECORD, and that is why it is a separate object from the run that produced
# it. A run is something that happened; a proposal is something with a life — proposed, opened as a PR,
# then merged, rejected or superseded — and that life routinely outlasts the night it was noticed on.
#
# DELIBERATELY NO ownerReference TO ITS ReviewRun. Wiring one looks obvious and is wrong: it would let
# the run's expiry garbage-collect the decision. This is the same conclusion alert-troubleshooter#37
# reached for TroubleshootingReports — "an incident report is an audit record and persists when its
# alert is deleted, which makes an ownerReference exactly the wrong mechanism". The link is a plain
# reference in spec.producedBy.runRef, so pruning runs never destroys the record of what was decided.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proposals.review.krateo.io
spec:
  group: review.krateo.io
  scope: Namespaced
  names:
    kind: Proposal
    plural: proposals
    singular: proposal
    shortNames: [prop]
    categories: [krateo]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Kind,       type: string, jsonPath: .spec.kind }
        - { name: Subject,    type: string, jsonPath: .spec.subject }
        - { name: Phase,      type: string, jsonPath: .status.phase }
        - { name: Confidence, type: string, jsonPath: .spec.confidence }
        - { name: PR,         type: string, jsonPath: .status.pullRequest.url }
        - { name: Age,        type: date,   jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [kind, title, rationale, evidence, target, change, fingerprint, producedBy]
              properties:
                kind:
                  type: string
                  enum: [Alert, Widget, Prompt, Policy, Documentation]
                  description: What is being proposed. Each maps to a different target repository.
                subject:
                  type: string
                  maxLength: 160
                  description: >-
                    WHAT THE FINDING IS ABOUT, as `component/signal` in lowercase kebab — e.g.
                    installer-chart-inspector/rbac-generation-http-500. Stable across nights where the
                    target is not: the model re-chooses the repository every night, so one failure used
                    to arrive as several unrelated proposals. A new proposal whose kind and subject match
                    a Proposed one from an EARLIER run supersedes it (status.supersededBy). Normalised by
                    the service, never trusted as typed. OPTIONAL because proposals written before
                    0.1.21 have none, and an absent subject NEVER matches another absent one — otherwise
                    the first night after the upgrade would retire every legacy proposal of each kind.
                title:     { type: string, maxLength: 200 }
                rationale:
                  type: string
                  maxLength: 4000
                  description: Why this is being proposed, in the agent's own words. Separate from the
                    evidence below so a reader can tell the ARGUMENT from the FACTS it rests on.
                evidence:
                  type: array
                  minItems: 1
                  description: >-
                    REQUIRED, AND THE POINT OF THE WHOLE OBJECT. A proposal with no evidence is an
                    opinion, and alert-troubleshooter#30 is the record of what that costs: a report
                    asserted high confidence from an analysis whose tool calls had all failed. Each
                    entry names its SOURCE and what was seen there. It deliberately does NOT carry a
                    query: that field existed until 0.1.16 and the model filled it with a plausible
                    reconstruction, citing SQL this service had never issued. The real queries are
                    recorded on the ReviewRun by the code that ran them, which is what a reviewer
                    should re-run.
                  items:
                    type: object
                    required: [source, summary]
                    properties:
                      source:  { type: string, enum: [clickhouse, kagent-sessions, kubernetes, repository, agent-analysis] }
                      summary: { type: string, maxLength: 2000 }
                      query:
                        type: string
                        maxLength: 4000
                        description: >-
                          HISTORICAL, NO LONGER WRITTEN. Removed from the response contract in 0.1.16
                          because the model invented it. The field stays declared on purpose: this
                          schema is structural, so deleting it would PRUNE the value from every stored
                          proposal on its next write — and 17 entries across the proposals on 057 still
                          carry one. Those are the fabricated queries themselves, which are the record
                          of why the field went away. Do not read a value here as something this
                          service ran; the queries it actually issued are recorded on the ReviewRun.
                      observedCount:
                        type: integer
                        description: >-
                          MODEL-AUTHORED AND UNVERIFIED, like `confidence` (#14). It was once summed to
                          decide whether `high` was earned; that check was arithmetic on this number,
                          so any value the model wrote satisfied it. Useful as a rough sense of scale,
                          worthless as corroboration.
                confidence:
                  type: string
                  enum: [high, medium, low]
                  description: >-
                    THE MODEL'S OWN ESTIMATE, NOT A VERIFIED PROPERTY OF `evidence` (#14). Read it as
                    the author's stated uncertainty and nothing more. The service does not check it and
                    no longer pretends to: a cap used to demote `high` unless two evidence items or a
                    summed `observedCount` of two backed it, but `observedCount` is model-authored and
                    unbounded, so the cap was arithmetic on the claim it was supposed to test — it
                    never fired once across the first nine real proposals. Treat `high` as a request
                    for attention, not as evidence that attention is warranted; the evidence entries
                    and the queries recorded on the run are what a reviewer should actually read.
                    Deriving this from what the sources returned would describe the RUN, not the
                    proposal, and would be the same value for every proposal in a night.
                target:
                  type: object
                  required: [repo]
                  description: Where the change would land. One repo per proposal — a proposal that
                    would need edits in two repositories should be split into two.
                  properties:
                    repo:   { type: string }
                    path:   { type: string }
                    branch: { type: string }
                change:
                  type: object
                  required: [format, content]
                  properties:
                    format:  { type: string, enum: [yaml, markdown, diff] }
                    content: { type: string, maxLength: 65536 }
                fingerprint:
                  type: string
                  maxLength: 128
                  description: >-
                    Stable hash of (kind + target + normalised content). WITHOUT THIS THE LOOP IS
                    UNUSABLE: night two re-proposes everything night one proposed and the reviewer
                    drowns. The service refuses to create a second Proposal carrying a fingerprint
                    that an open one already has, and supersedes rather than duplicates.
                producedBy:
                  type: object
                  required: [runRef]
                  properties:
                    runRef: { type: string, description: "Name of the ReviewRun. A REFERENCE, never an ownerReference." }
                    agent:  { type: string }
                    model:  { type: string }
                decision:
                  type: object
                  required: [phase]
                  description: >-
                    A PERSON'S DECISION, AND THE ONLY PART OF THE SPEC ANYONE BUT THIS SERVICE MAY WRITE.
                    It lives in the spec, not the status, because the portal writes through snowplow's
                    /call, which builds only the main-resource path and so cannot reach the status
                    subresource — the same reason the incident page records spec.lifecycle on a
                    TroubleshootingReport. The portal merge-patches this object with the user's own
                    token; nightly-review copies it onto status (phase, decidedBy, decidedAt, reason) on
                    its next run, and a reader should take this field over status.phase until then.
                    The chart's admission policies (templates/decision-policy.yaml in the nightly-review
                    chart) keep every other spec field immutable to people, stamp decidedBy and decidedAt
                    from the request itself so a client cannot say who decided, and allow exactly one
                    change of mind: PrOpen to Rejected.
                  x-kubernetes-validations:
                    - rule: self.phase != 'PrOpen' || has(self.claim)
                      message: a PrOpen decision names the BuilderPublish claim that opened the change request
                  properties:
                    phase:
                      type: string
                      enum: [PrOpen, Rejected]
                      description: >-
                        The two outcomes a person reaches from the portal. Merged is absent on purpose: a
                        merge happens in the repository, and a reconciler reading the pull request back is
                        what should record it, not a button.
                    reason:
                      type: string
                      maxLength: 1000
                      description: Why, in the decider's words. Optional; a rejection with a reason is what the next prompt change learns from.
                    decidedBy:
                      type: string
                      description: >-
                        STAMPED BY ADMISSION FROM request.userInfo.username; whatever the client sends is
                        overwritten. For a portal user this is the identity in their authn-issued
                        clientconfig, because snowplow's /call dials the apiserver as the caller.
                    decidedAt:
                      type: string
                      format: date-time
                      description: >-
                        STAMPED BY ADMISSION, from the apiserver's own clock as recorded in managedFields
                        for this write — CEL has no now(). Whatever the client sends is overwritten.
                    claim:
                      type: string
                      maxLength: 253
                      description: >-
                        The BuilderPublish claim the portal created to open the change request. Required
                        with PrOpen. Mirrored onto the review.krateo.io/publish-claim label, where the
                        service records the claims it creates itself, so one selector finds both.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Proposed, PrOpen, Merged, Rejected, Superseded, Refused, Failed]
                  description: >-
                    Failed is explicit so a proposal whose pull request could not be opened is visible
                    rather than sitting forever in Proposed looking merely undecided. Refused is
                    HISTORICAL and is no longer written: it recorded a proposal whose target was outside
                    the per-kind allowlist, and that allowlist has been removed — every proposal now
                    becomes a pull request a human reads. The value stays in this enum on purpose,
                    because objects written while it existed are still on the cluster and removing it
                    produced nothing readable at all.
                pullRequest:
                  type: object
                  properties:
                    url:    { type: string }
                    number: { type: integer }
                    state:  { type: string, enum: [open, merged, closed] }
                # Written by the service: for Superseded from its own run, and for PrOpen/Rejected as a
                # COPY of spec.decision, which is the person's input and wins until this catches up.
                decidedAt: { type: string, format: date-time }
                decidedBy: { type: string }
                reason:    { type: string }
                supersededBy:
                  type: string
                  description: >-
                    Name of the Proposal that replaced this one — written with phase Superseded when a
                    later run proposed a different change for the same finding (kind + subject) or the
                    same file (kind + target). Declared from the start and first written in 0.1.21.
                expiresAt:
                  type: string
                  format: date-time
                  description: >-
                    Set ONLY once the phase is terminal. An open proposal is never collected — it is
                    an undecided question, and deleting those is how a review loop quietly stops
                    mattering. kagent's unbounded tables filled a PVC and PANICked Postgres this month;
                    the answer is a retention policy that distinguishes decided from open, not one
                    that treats every row the same.
                error: { type: string }
                conditions:
                  type: array
                  description: >-
                    TargetResolved is written on every proposal the service records: True/RepoFound,
                    False/NotFoundOrPrivate (GitHub answered 404 to an ANONYMOUS request — the repository is
                    missing or private, and the check cannot tell which), False/InvalidRepo (not an
                    owner/name), or Unknown/CheckFailed|CheckDisabled (the question was not answered).
                    False is a normal state, not a rejection: the finding stands and wants re-aiming.
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      reason:             { type: string }
                      message:            { type: string }
                      lastTransitionTime: { type: string, format: date-time }
