# A ReviewRun is an EVENT: one nightly execution. It records what was examined and what came of it,
# and it is safe to prune. The Proposals it produced are NOT owned by it (see proposal.crd.yaml) —
# a decision record must outlive the run that happened to notice it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reviewruns.review.krateo.io
spec:
  group: review.krateo.io
  scope: Namespaced
  names:
    kind: ReviewRun
    plural: reviewruns
    singular: reviewrun
    shortNames: [rrun]
    categories: [krateo]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Phase,     type: string, jsonPath: .status.phase }
        - { name: Proposals, type: integer, jsonPath: .status.proposals.created }
        - { name: Started,   type: date,   jsonPath: .status.startedAt }
        - { name: Expires,   type: date,   jsonPath: .status.expiresAt }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [window]
              properties:
                window:
                  type: object
                  required: [from, to]
                  description: >-
                    The closed time range examined. BOUNDED ON PURPOSE, and not only for cost: spans
                    ingested before the otel-collector JWT redaction landed can still carry unredacted
                    credentials, so a window that reaches back far enough would pull secrets into the
                    agent's context and from there into a pull request body.
                  properties:
                    from: { type: string, format: date-time }
                    to:   { type: string, format: date-time }
                sources:
                  type: array
                  description: Evidence sources this run was asked to read.
                  items: { type: string, enum: [clickhouse, kagent-sessions, kubernetes, agent-analysis] }
                dryRun:
                  type: boolean
                  default: false
                  description: >-
                    Produce Proposals but open no pull requests. The honest way to evaluate a night's
                    output before granting the loop the ability to act on it.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Completed, PartiallyCompleted, Failed]
                  description: >-
                    PartiallyCompleted is load-bearing and must not be collapsed into Completed. If
                    ClickHouse answered and the sessions API 401'd, the run produced a real but
                    INCOMPLETE picture, and a proposal built on half the evidence should be read
                    differently. A phase that reports success for a half-finished run is the failure
                    mode this platform keeps rediscovering.
                startedAt:  { type: string, format: date-time }
                finishedAt: { type: string, format: date-time }
                expiresAt:
                  type: string
                  format: date-time
                  description: >-
                    When the collector may delete this run. Stamped at completion from the chart's
                    retention policy so the lifetime is visible ON the object rather than implied by
                    a controller setting nobody can see. Proposals have their own, later, expiry.
                evidence:
                  type: object
                  description: >-
                    COUNTS AND QUERIES ONLY, never retrieved content. Telemetry rows do not belong in
                    etcd, and keeping them here would re-create in a CR the very exposure the window
                    bound above exists to prevent. (The one bounded exception, redacted excerpts inside
                    the per-agent assessments, lives in status.agentAnalysis, not here.)
                  additionalProperties:
                    type: object
                    properties:
                      ok:        { type: boolean }
                      queried:   { type: integer }
                      returned:  { type: integer }
                      sessions:  { type: integer }
                      createdInWindow: { type: integer }
                      agentsDeployed:       { type: integer }
                      agentsNeverUsed:      { type: integer }
                      agentsIdle7d:         { type: integer }
                      agentsActiveInWindow: { type: integer }
                      scope:
                        type: string
                        description: >-
                          WHAT THIS SOURCE WAS ALLOWED TO SEE, in words, when that is not the obvious
                          thing. Written by kagent-sessions, which reads session metadata AND the text of
                          user-authored messages for EVERY user out of kagent's Postgres — a deliberate
                          departure from the per-user RBAC the rest of this platform enforces, and
                          therefore something the record must state rather than leave to be discovered.
                          The role holds SELECT on `session` and `event` and is revoked on `task`. The
                          kagent-sessions source leaves agent replies and tool output out, by the query
                          and again in code; the agent-analysis source reads them, and says so here in
                          its own scope. Declared here because this schema is
                          structural: an undeclared field is pruned on write, and the run would then
                          claim a scope it never recorded — the same silent-pruning bug that hid the
                          truncation fields in 0.1.14.
                      error:     { type: string }
                      empty:
                        type: boolean
                        description: >-
                          The source ANSWERED and returned nothing. Distinct from ok:false (it did not
                          answer) and from a low `returned` (it answered with little). Without this field
                          the three were indistinguishable in the record — `returned: 0` meant "no rows",
                          "an identity that sees none" or "a shape we did not parse". NOTE that empty
                          alone is no longer degradation: an empty source carrying a `note` that explains
                          why has been read, and the answer was nothing. Counting it made every
                          successful run report PartiallyCompleted forever, which is a status carrying no
                          information.
                      truncated:
                        type: boolean
                        description: >-
                          This source produced more than the per-source character cap and was CUT before
                          reaching the model. It matters because the marker used to go only into the
                          corpus, where the model could see it and the record could not, while `returned`
                          still looked complete — so whoever wrote the most logs quietly decided what got
                          reviewed. A proposal built on a truncated source must be readable as such.
                      truncatedAtChars:
                        type: integer
                        description: The cap that was applied, so the record does not depend on the value in force today.
                      droppedChars:
                        type: integer
                        description: How much was cut. A large number here means the interesting minority may never have been seen.
                      note:
                        type: string
                        description: >-
                          Why this source returned what it did, in words, when the numbers cannot say it.
                      queries:
                        type: object
                        additionalProperties: { type: string }
                        description: >-
                          THE SQL THIS SOURCE ACTUALLY RAN, by name, with the window already bound — what
                          a reviewer re-runs to disagree with a proposal. Written since 0.1.14 and PRUNED
                          until 0.1.21 because it was never declared: every run on 057 came back with
                          ok/queried/returned and no queries, so the record the pull request body pointed
                          readers at did not exist. Counts and SQL only; the rows stay out of etcd.
                      questions:
                        type: integer
                        description: >-
                          User-authored messages quoted to the model from kagent sessions in the window,
                          after the per-session caps. The TEXT never lands here — only the count.
                      questionSessions:
                        type: integer
                        description: Conversations those questions came from.
                      droppedMessages:
                        type: integer
                        description: >-
                          Questions inside the window that the per-session message or character cap
                          kept from the model. Recorded beside `truncated`, which is set too.
                      droppedSessions:
                        type: integer
                        description: >-
                          Conversations in the window beyond the session cap (or, for agent-analysis,
                          beyond the per-agent session cap or character budget) that the model never saw.
                      questionsFolded:
                        type: integer
                        description: >-
                          kagent-sessions only. Conversations whose questions were read in full by the
                          agent-analysis stage and so were NOT quoted again in the main corpus — replaced
                          by one pointer line per agent. The truncation fields beside it describe what was
                          actually sent after that fold. Agents the analysis did not cover keep their
                          questions here.
                      corpusDroppedChars:
                        type: integer
                        description: >-
                          agent-analysis only. Characters of the ASSESSMENTS cut before the main review,
                          by the per-agent share or config.agentAnalysis.corpusMaxChars — distinct from
                          droppedChars, which is what the per-agent calls themselves did not see.
                      droppedAgents:
                        type: integer
                        description: >-
                          agent-analysis only. Agents with conversations in the window left unanalysed
                          because the run's agent cap (config.agentAnalysis.maxAgents) was reached. Named
                          in `skipped`.
                      skipped:
                        type: array
                        maxItems: 30
                        description: >-
                          agent-analysis only. Agents with conversations in the window that were not
                          analysed, and why: `over maxAgents`, `excluded` (config.agentAnalysis.
                          excludeAgents, and always the reviewer itself), or `not deployed` — sessions
                          outlive their agent, and a retired agent's leftovers are history, not a finding.
                        items:
                          type: object
                          properties:
                            agent:    { type: string }
                            sessions: { type: integer }
                            reason:   { type: string, enum: [over maxAgents, excluded, not deployed] }
                      agents:
                        type: array
                        maxItems: 30
                        description: >-
                          agent-analysis only. One entry per agent the stage chose, whether or not its
                          call succeeded: what it read, what was cut, what the call cost, and — when it
                          failed — why. One agent's failure is recorded here and never blanks the run.
                        items:
                          type: object
                          properties:
                            agent:             { type: string, description: "namespace/name" }
                            sessions:          { type: integer, description: "Conversations of this agent in the window." }
                            delegatedSessions: { type: integer, description: "Of those, opened by another agent over A2A." }
                            conversations:     { type: integer, description: "Conversations actually shown to the model." }
                            messages:          { type: integer, description: "Stored events shown to the model." }
                            chars:             { type: integer, description: "Characters of conversation shown to the model, in the same units as droppedChars." }
                            droppedChars:      { type: integer, description: "Characters cut by the per-message, per-tool-result and per-agent caps, and events too large to fetch." }
                            droppedMessages:   { type: integer, description: "Events in the window the model did not see, whatever cut them." }
                            droppedSessions:   { type: integer }
                            promptChars:       { type: integer, description: "The resolved prompt's size before the prompt cap." }
                            promptTruncated:   { type: boolean }
                            promptSource:
                              type: string
                              description: >-
                                Where the prompt that was analysed came from: spec.declarative.systemMessage
                                and, through promptTemplate include(), the ConfigMap keys it resolved. Never a
                                Secret — a systemMessageFrom Secret is recorded in promptNote as not read.
                            promptNote:        { type: string, description: "What could not be resolved in the prompt, and why." }
                            promptRepo:
                              type: string
                              description: >-
                                The repository the Agent (or its prompt ConfigMap) DECLARES its prompt lives
                                in, by annotation (krateo.io/prompt-repo, krateo.io/source-repo or
                                org.opencontainers.image.source). A Prompt proposal about this agent is aimed
                                there whatever the model chose. Absent when nothing declares one.
                            tokens:
                              type: object
                              description: What this agent's call reported. Absent when it reported nothing.
                              properties:
                                inputTokens:  { type: integer }
                                outputTokens: { type: integer }
                                totalTokens:  { type: integer }
                            measured:
                              type: object
                              description: Counted by the service from the stored events, not by the model.
                              properties:
                                conversations:           { type: integer }
                                withToolErrors:          { type: integer }
                                unansweredAtWindowEnd:   { type: integer }
                                withARepeatedCall3x:     { type: integer }
                                delegatedByAnotherAgent: { type: integer }
                            patterns:           { type: integer, description: "Failure patterns kept after the service's checks." }
                            promptFindings:     { type: integer }
                            unverifiedExamples:
                              type: integer
                              description: >-
                                Quoted excerpts the service could not find in the transcript (or prompt) they
                                claimed to come from, plus patterns citing no conversation that exists — all
                                dropped. A high number means the analysis is paraphrasing or inventing.
                            error:              { type: string }
                      shapes:
                        type: object
                        additionalProperties: { type: integer }
                        description: >-
                          HOW THE STORED EVENTS READ, counted: matched (a user's question), unmatched
                          (valid JSON that is not one), unparseable, empty, and notUserAuthored (agent
                          replies and tool output the query left in the database). kagent's event.data is
                          an ADK event serialised verbatim and its shape is pinned nowhere readable, so
                          this is what tells "nobody asked anything" from "the reader no longer
                          understands the corpus" — two identical empty results that mean opposite things.
                      shape:
                        type: string
                        description: >-
                          The top-level shape of the response, recorded when a source returns something
                          unexpected — kagent's /api/sessions omits `data` entirely on an empty list,
                          which a naive reader turns into an empty list and reports as success.
                proposals:
                  type: object
                  properties:
                    created:     { type: integer }
                    superseded:  { type: integer }
                    deduplicated:
                      type: integer
                      description: Suppressed because an open Proposal already carried the same fingerprint.
                    refused:
                      type: integer
                      description: >-
                        HISTORICAL, no longer written. It counted proposals recorded in phase Refused
                        because their target was outside the per-kind allowlist. That allowlist has been
                        removed — every proposal now becomes a pull request a human reads — so the
                        counter stays only so the runs that recorded one remain readable.
                    refs:
                      type: array
                      items: { type: string }
                summary:
                  type: string
                  maxLength: 2000
                  description: >-
                    The model's own account of the night, from the response contract's `summary` —
                    asked for since the first release and discarded until 0.1.21. Redacted like every
                    other model string. The model's words, not a verified finding — EXCEPT its first
                    sentence when anything was cut: that is status.coverage.sentence, written by the
                    service, so a summary of a partial reading says it is one.
                coverage:
                  type: object
                  description: >-
                    HOW MUCH OF THE NIGHT THE REVIEW SAW, counted by the service from the sources' own
                    stats — never by the model, which cannot know what it was not shown. Written before
                    the main ask, so a run that fails there still has it. Conversations are the
                    agent-analysis stage's: read counts only agents whose call returned an assessment;
                    total counts every conversation of the agents chosen or skipped for the agent cap
                    (excluded and retired agents are out of scope, not missed). Characters are in the
                    stage's rendered units, and charsTotal is a lower bound whenever something was
                    dropped without being fetched. rr-20260930-0200 read 21 of 65 conversations and its
                    summary did not say so; this is why.
                  properties:
                    complete:          { type: boolean, description: "Nothing was cut, skipped or truncated." }
                    sentence:          { type: string, maxLength: 600, description: "The coverage in words; the first sentence of status.summary whenever complete is false, and part of the main model's corpus note always." }
                    conversationsRead:  { type: integer }
                    conversationsTotal: { type: integer }
                    charsRead:          { type: integer }
                    charsTotal:         { type: integer }
                    charsTotalIsLowerBound: { type: boolean }
                    agentsSkipped:
                      type: array
                      maxItems: 30
                      items:
                        type: object
                        properties:
                          agent:  { type: string }
                          reason: { type: string, enum: [over maxAgents, analysis failed, nothing readable] }
                    sourcesCut:
                      type: array
                      maxItems: 10
                      items:
                        type: object
                        properties:
                          source:       { type: string }
                          droppedChars: { type: integer }
                    sourcesFailed:
                      type: array
                      description: Sources that did not answer at all (ok false).
                      items: { type: string }
                steps:
                  type: array
                  description: >-
                    Where the run spent its time and where it stopped: gather, analyse, ask, validate,
                    publish, record, in that order. `analyse` is the per-agent conversation analysis; it
                    is Failed only when no agent could be analysed, and the run still goes on to ask. The phase says THAT a run failed; this says in which stage,
                    and in particular whether the model was ever called. `publish` is Skipped on a dry
                    run — the permanent mode, since the portal opens pull requests per proposal.
                  items:
                    type: object
                    required: [name, phase]
                    properties:
                      name:       { type: string, enum: [gather, analyse, ask, validate, publish, record] }
                      phase:      { type: string, enum: [Running, Succeeded, Failed, Skipped] }
                      startedAt:  { type: string, format: date-time }
                      finishedAt: { type: string, format: date-time }
                      message:    { type: string, maxLength: 500 }
                model:
                  type: object
                  description: >-
                    Token usage THE AGENT REPORTED, from kagent's `kagent_usage_metadata` on the A2A
                    stream. Absent when it reported none. Until 0.1.21 this was read from a key kagent
                    never sends and written unconditionally, so every run carried zeros that looked like
                    a measurement. There is no model NAME: the A2A response does not carry one, and the
                    chart's configured ModelConfig is what was asked for, not what answered.
                  properties:
                    inputTokens:  { type: integer }
                    outputTokens: { type: integer }
                    totalTokens:  { type: integer }
                usage:
                  type: object
                  description: >-
                    EVERY model call this run made — one per analysed agent, then the main ask — each with
                    the tokens it reported, and a total. status.model stays the main ask alone, as before.
                    A call that reported nothing is listed without token fields rather than as zeros, and
                    `total` says how many calls it covers, so a sum over some calls is never read as the
                    night's cost.
                  properties:
                    calls:
                      type: array
                      maxItems: 40
                      items:
                        type: object
                        properties:
                          step:         { type: string, enum: [analyse, ask] }
                          agent:        { type: string }
                          inputTokens:  { type: integer }
                          outputTokens: { type: integer }
                          totalTokens:  { type: integer }
                    total:
                      type: object
                      properties:
                        calls:         { type: integer }
                        reportedCalls: { type: integer }
                        inputTokens:   { type: integer }
                        outputTokens:  { type: integer }
                        totalTokens:   { type: integer }
                agentAnalysis:
                  type: object
                  description: >-
                    What the analyse stage concluded, per agent, bounded so the portal can show it. These
                    are what the main review read INSTEAD of the transcripts. Model output, redacted and
                    counted by the service: `count` is the number of distinct cited conversations that
                    exist, and every excerpt was found in the transcript (or, for promptExcerpt, in the
                    prompt) it claims to quote. Conversations are named by a per-run ordinal, never an
                    id, and no user is named. THE ONE PLACE A RUN KEEPS QUOTED CONTENT, deliberately and
                    bounded: at most three redacted excerpts of 300 characters per pattern.
                  properties:
                    assessments:
                      type: array
                      maxItems: 20
                      items:
                        type: object
                        properties:
                          agent:         { type: string }
                          conversations: { type: integer }
                          promptSource:  { type: string, maxLength: 300 }
                          promptRepo:    { type: string }
                          summary:       { type: string, maxLength: 600 }
                          servedWell:    { type: string, maxLength: 400 }
                          measured:
                            type: object
                            properties:
                              conversations:           { type: integer }
                              withToolErrors:          { type: integer }
                              unansweredAtWindowEnd:   { type: integer }
                              withARepeatedCall3x:     { type: integer }
                              delegatedByAnotherAgent: { type: integer }
                          failurePatterns:
                            type: array
                            maxItems: 8
                            items:
                              type: object
                              properties:
                                pattern:  { type: string, maxLength: 200 }
                                category: { type: string, enum: [misroute, refusal, wrong-or-invented, tool-failure, loop, ignored-instruction, other] }
                                count:    { type: integer }
                                conversations: { type: array, maxItems: 50, items: { type: integer } }
                                examples:
                                  type: array
                                  maxItems: 3
                                  items:
                                    type: object
                                    properties:
                                      conversation: { type: integer }
                                      excerpt:      { type: string, maxLength: 320 }
                          promptFindings:
                            type: array
                            maxItems: 6
                            items:
                              type: object
                              properties:
                                finding:         { type: string, maxLength: 400 }
                                promptExcerpt:   { type: string, maxLength: 320 }
                                evidence:        { type: string, maxLength: 600 }
                                suggestedChange: { type: string, maxLength: 1200 }
                                count:           { type: integer }
                                conversations:   { type: array, maxItems: 50, items: { type: integer } }
                          recurringNeeds:
                            type: array
                            maxItems: 6
                            items:
                              type: object
                              properties:
                                need:          { type: string, maxLength: 200 }
                                count:         { type: integer }
                                conversations: { type: array, maxItems: 50, items: { type: integer } }
                                examples:
                                  type: array
                                  maxItems: 3
                                  items:
                                    type: object
                                    properties:
                                      conversation: { type: integer }
                                      excerpt:      { type: string, maxLength: 320 }
                error: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:               { type: string }
                      status:             { type: string }
                      reason:             { type: string }
                      message:            { type: string }
                      lastTransitionTime: { type: string, format: date-time }
