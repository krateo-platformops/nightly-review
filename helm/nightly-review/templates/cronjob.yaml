apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nightly-review.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ .Values.suspend }}
  # A missed night is skipped, never caught up. Two reviews firing back to back would read overlapping
  # windows and propose the same things twice, and the second would be deduplicated by fingerprint into
  # a no-op that still cost a full model run.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0   # a failed run is recorded on the ReviewRun and waits for tomorrow; retrying a
                        # half-finished review would re-spend a model call to reach the same verdict
      # A RUN THAT DEPENDS ON EXTERNAL MODEL CALLS MUST HAVE AN END. The analyse stage adds up to
      # config.agentAnalysis.totalSeconds on top of the gather and the main ask. Without a deadline, a hung
      # call holds the night's slot forever, and concurrencyPolicy: Forbid then skips every later night.
      # On the deadline the pod gets SIGTERM; main.py records the run as Failed within the grace period.
      activeDeadlineSeconds: {{ .Values.jobDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          serviceAccountName: {{ include "nightly-review.fullname" . }}
          containers:
            - name: review
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace }}
                - name: WINDOW_HOURS
                  value: {{ .Values.windowHours | quote }}
                - name: DRY_RUN
                  value: {{ .Values.dryRun | quote }}
                - name: RUN_RETENTION_DAYS
                  value: {{ .Values.retention.runDays | quote }}
                # ORDER MATTERS, AND NOT IN THE OBVIOUS WAY. An explicit reviewerA2aUrl always wins.
                # Otherwise a reviewer this chart CREATES beats the deprecated alias — because the
                # existing release sets that alias to `autopilot`, and honouring it first would leave
                # the upgrade pointing straight back at the orchestrator this release exists to stop
                # calling: a fix that renders, deploys, and changes nothing. The alias is only consulted
                # when no reviewer is being created, which is the one case it still means something.
                - name: AUTOPILOT_A2A_URL
                  {{- if .Values.config.reviewerA2aUrl }}
                  value: {{ .Values.config.reviewerA2aUrl | quote }}
                  {{- else if .Values.reviewer.create }}
                  value: {{ printf "http://%s.%s.svc:8080/" .Values.reviewer.name .Release.Namespace | quote }}
                  {{- else }}
                  value: {{ required "config.reviewerA2aUrl is required when reviewer.create is false" .Values.config.autopilotA2aUrl | quote }}
                  {{- end }}
                - name: A2A_TIMEOUT
                  value: {{ .Values.config.a2aTimeoutSeconds | quote }}
                - name: A2A_READ_TIMEOUT
                  value: {{ .Values.config.a2aReadTimeoutSeconds | quote }}
                - name: AUTHN_URL
                  value: {{ .Values.config.authnUrl | quote }}
                - name: KAGENT_API_URL
                  value: {{ .Values.config.kagentApiUrl | quote }}
                - name: CLICKHOUSE_URL
                  value: {{ .Values.config.clickhouseUrl | quote }}
                - name: TARGET_CHECK_API_URL
                  value: {{ .Values.config.targetCheckApiUrl | quote }}
                {{- /* THE KUBELET READS THIS SECRET, NOT THE SERVICE. secretKeyRef is resolved by the
                       node when the pod starts, under the kubelet's own authority, so it needs no RBAC:
                       the ServiceAccount (templates/rbac.yaml) still holds no verb on Secrets, and a
                       component whose corpus goes to a model still cannot read any Secret itself. It
                       gets this one value and no other. `optional: true` so an install without the
                       Secret (or the key) starts and checks anonymously, rather than failing to start. */}}
                {{- with .Values.config.targetCheck.tokenSecret }}
                {{- if .name }}
                - name: TARGET_CHECK_TOKEN
                  valueFrom:
                    secretKeyRef: { name: {{ .name }}, key: {{ .key | default "token" }}, optional: true }
                {{- end }}
                {{- end }}
                - name: TARGET_DESTINATIONS
                  value: {{ .Values.config.targets | default dict | toJson | quote }}
                - name: EVIDENCE_MAX_CHARS
                  value: {{ .Values.config.evidenceMaxChars | quote }}
                # A JSON blob so the queries stay reviewable as data.
                - name: CLICKHOUSE_QUERIES
                  value: {{ .Values.clickhouseQueries | toJson | quote }}
                                {{- with .Values.secrets.clickhouse.name }}
                - name: CLICKHOUSE_USER
                  valueFrom:
                    secretKeyRef: { name: {{ . }}, key: {{ $.Values.secrets.clickhouse.userKey }} }
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ . }}, key: {{ $.Values.secrets.clickhouse.passwordKey }} }
                {{- end }}
                {{- /* kagent's Postgres, across all users: session METADATA, and the text of
                       user-authored messages. The credential is expected to be a role granted SELECT on
                       `session` and `event` and nothing else — still revoked on `task`. The narrowness
                       is enforced by the grant, not by this chart, so it must be verified where the role
                       is created (session=t, event=t, task=f) and not assumed from these keys. */}}
                - name: KAGENT_DB_HOST
                  value: {{ .Values.config.kagentDbHost | quote }}
                - name: KAGENT_DB_PORT
                  value: {{ .Values.config.kagentDbPort | quote }}
                - name: KAGENT_DB_NAME
                  value: {{ .Values.config.kagentDbName | quote }}
                - name: KAGENT_QUESTIONS_MAX_SESSIONS
                  value: {{ .Values.config.kagentQuestions.maxSessions | quote }}
                - name: KAGENT_QUESTIONS_PER_SESSION
                  value: {{ .Values.config.kagentQuestions.maxMessagesPerSession | quote }}
                - name: KAGENT_QUESTIONS_CHARS_PER_SESSION
                  value: {{ .Values.config.kagentQuestions.maxCharsPerSession | quote }}
                {{- /* The reviewer's own sessions carry last night's corpus as their user turn; read
                       back, they would feed the review its own input. Only the agent this chart creates
                       is known here — a reviewer brought via reviewerA2aUrl is not excluded. */}}
                {{- if .Values.reviewer.create }}
                - name: KAGENT_QUESTIONS_EXCLUDE_AGENTS
                  value: {{ printf "%s/%s" .Release.Namespace .Values.reviewer.name | quote }}
                {{- end }}
                {{- /* The analyse stage: one model call per agent over its conversations in full. Every
                       budget is a value, and every cut is recorded on the run. */}}
                {{- with .Values.config.agentAnalysis }}
                - name: AGENT_ANALYSIS_MAX_AGENTS
                  value: {{ .maxAgents | quote }}
                - name: AGENT_ANALYSIS_MAX_SESSIONS_PER_AGENT
                  value: {{ .maxSessionsPerAgent | quote }}
                - name: AGENT_ANALYSIS_MAX_MESSAGES_PER_SESSION
                  value: {{ .maxMessagesPerSession | quote }}
                - name: AGENT_ANALYSIS_MAX_CHARS_PER_AGENT
                  value: {{ .maxCharsPerAgent | quote }}
                - name: AGENT_ANALYSIS_MAX_CHARS_PER_MESSAGE
                  value: {{ .maxCharsPerMessage | quote }}
                - name: AGENT_ANALYSIS_MAX_TOOL_RESULT_CHARS
                  value: {{ .maxToolResultChars | quote }}
                - name: AGENT_ANALYSIS_MAX_TOOL_ARGS_CHARS
                  value: {{ .maxToolArgsChars | quote }}
                - name: AGENT_ANALYSIS_MAX_PROMPT_CHARS
                  value: {{ .maxPromptChars | quote }}
                - name: AGENT_ANALYSIS_MAX_EVENT_CHARS
                  value: {{ .maxEventChars | quote }}
                - name: AGENT_ANALYSIS_TIMEOUT_SECONDS
                  value: {{ .timeoutSeconds | quote }}
                - name: AGENT_ANALYSIS_TOTAL_SECONDS
                  value: {{ .totalSeconds | quote }}
                - name: AGENT_ANALYSIS_CORPUS_MAX_CHARS
                  value: {{ .corpusMaxChars | quote }}
                - name: AGENT_ANALYSIS_EXCLUDE_AGENTS
                  value: {{ join "," .excludeAgents | quote }}
                {{- end }}
                {{- with .Values.secrets.kagentDb.name }}
                - name: KAGENT_DB_USER
                  valueFrom:
                    secretKeyRef: { name: {{ . }}, key: {{ $.Values.secrets.kagentDb.userKey }} }
                - name: KAGENT_DB_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ . }}, key: {{ $.Values.secrets.kagentDb.passwordKey }} }
                {{- end }}
              volumeMounts:
                {{- if .Values.config.authnUrl }}
                - name: authn-token
                  mountPath: /var/run/secrets/krateo/authn
                  readOnly: true
                {{- end }}
              resources: {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
          volumes:
            {{- if .Values.config.authnUrl }}
            # Audience-scoped: this token is only good for authn, so a leak cannot be replayed against
            # the apiserver.
            - name: authn-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: authn
                      expirationSeconds: 3600
            {{- end }}
