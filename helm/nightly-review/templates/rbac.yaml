apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nightly-review.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
# Deliberately narrow. The service writes ONLY its own two kinds, and READS only what it needs to know
# what the platform already notices. It has no access to Secrets: the corpus it assembles is handed to a
# model, and a component that could read Secrets could put one in a prompt.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nightly-review.fullname" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["review.krateo.io"]
    resources: ["reviewruns", "proposals", "reviewruns/status", "proposals/status"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["observability.krateo.io"]
    resources: ["alerts"]
    verbs: ["get", "list"]
  # Page roots, for the same reason as Alerts: a Widget proposal for a page that already exists is the
  # duplicate-alert failure in another kind. There is no Page kind; a page is a Flex named page-*.
  # Without this grant the read 403s and the kubernetes source is degraded on every run.
  - apiGroups: ["widgets.templates.krateo.io"]
    resources: ["flexes"]
    verbs: ["list"]
  # PUBLISHING IS A CLAIM NOW, NOT A GITHUB CALL. This service creates one BuilderPublish per proposal
  # and the platform's own chain does the rest, so the write credential it needs is this — permission to
  # ask — rather than a token that can reach a repository. `patch` is here because the claim name derives
  # from the proposal fingerprint: the same suggestion on a later night re-asserts the same claim, which
  # is how a level-based chain is meant to be driven.
  - apiGroups: ["composition.krateo.io"]
    resources: ["builderpublishes"]
    verbs: ["get", "list", "create", "patch"]
  {{- if gt (int .Values.config.agentAnalysis.maxAgents) 0 }}
  # AN AGENT'S PROMPT IS MOSTLY IN A CONFIGMAP. kagent's promptTemplate include("alias/key") reads keys
  # of ConfigMaps in the Agent's own namespace, and on 057 every production agent's systemMessage is a
  # single include — the 1-49k characters the analysis needs are in the ConfigMap. `get` only: the
  # stage reads the names an Agent's dataSources list, so it never needs to enumerate. This namespace
  # only, and narrowed to named ConfigMaps when config.agentAnalysis.promptConfigMaps lists them.
  #
  # NOT Secrets, even though systemMessageFrom may point at one and kagent writes the RESOLVED prompt
  # into the agent's config Secret — reading that would have been simpler. The corpus goes to a model,
  # and a component that can read Secrets can put one in a prompt; so the template is re-resolved from
  # the ConfigMaps instead, and a Secret-backed prompt is recorded as not read.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    {{- with .Values.config.agentAnalysis.promptConfigMaps }}
    resourceNames: {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nightly-review.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "nightly-review.fullname" . }} }
subjects:
  - kind: ServiceAccount
    name: {{ include "nightly-review.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.config.authnUrl }}
---
# Maps this component's Kubernetes ServiceAccount to a Krateo identity, so authn's `serviceaccount`
# strategy will exchange its projected token for a Krateo JWT. The CR's existence is the allowlist.
# Mirrors alert-troubleshooter, which is where this pattern is already proven in production.
apiVersion: serviceaccount.authn.krateo.io/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ include "nightly-review.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  displayName: nightly platform review (intra-service auth)
  serviceAccountRef:
    name: {{ include "nightly-review.fullname" . }}
    namespace: {{ .Release.Namespace }}
  groups:
    - krateo:nightly-review
{{- end }}
{{- if not .Values.dryRun }}
---
# CLUSTER-SCOPED, AND ONLY ONE VERB ON ONE NAME. The BuilderPublish kind is version-pinned by whichever
# portal release shipped it (v1-8-46 and so on), so the version is discovered at run time from the CRD
# rather than compiled in — a hardcoded one publishes nothing the morning after a portal bump, quietly,
# because the apiserver simply reports the kind as unknown. Gated on dryRun because a run that publishes
# nothing never needs to ask.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nightly-review.fullname" . }}-crd-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["builderpublishes.composition.krateo.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nightly-review.fullname" . }}-crd-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "nightly-review.fullname" . }}-crd-read }
subjects:
  - kind: ServiceAccount
    name: {{ include "nightly-review.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# CLUSTER-SCOPED, LIST ONLY, ON ONE KIND. kagent Agents are what the session source compares against to
# find agents that are DEPLOYED BUT HAVE NEVER BEEN USED — an agent with no session has no row to group,
# so the only way to see it is to read the deployed set. Cluster-scoped because agents need not live in
# this namespace. The analyse stage reads each Agent's SPEC (systemMessage, promptTemplate, annotations
# naming its prompt's repository); it does so from the same one-per-run list, and `get` is granted
# beside it so a single Agent can be re-read by name without widening anything — both are read-only on
# one kind. `list` has been here since 0.1.19.
#
# NOT gated on dryRun, unlike the CRD read below: this is evidence gathering and happens on every run
# whether or not anything is published.
#
# This is the shape that bit alert-troubleshooter#31 — a component whose code read cluster-wide while its
# chart shipped only a namespaced Role, so every pass 403'd and the correlation silently never ran. The
# source degrades with a note rather than failing if this is missing, which makes the absence quiet;
# that is exactly why the grant has to be here rather than assumed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nightly-review.fullname" . }}-agents-read
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["agents"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nightly-review.fullname" . }}-agents-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "nightly-review.fullname" . }}-agents-read }
subjects:
  - kind: ServiceAccount
    name: {{ include "nightly-review.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.portalAdminAccess.enabled }}
---
# WHAT THE PORTAL'S ADMINS NEED TO ACT ON A PROPOSAL. Read both kinds, and PATCH THE PROPOSAL ITSELF:
# the portal records a decision as spec.decision, because snowplow's /call builds only the main-resource
# path and cannot reach proposals/status. Not create, not delete.
#
# `patch` IS WIDER THAN WHAT IT IS FOR, and that is deliberate rather than overlooked: RBAC has no
# field granularity, so the same verb would let a button rewrite the evidence or the change. What a
# person may actually change — spec.decision, and nothing else — is enforced in admission, by
# templates/decision-policy.yaml, which also stamps who decided from the request.
#
# The status verbs stay: they are what an admin with kubectl, or a later portal that can reach the
# subresource, would use, and removing them would break both for no gain.
#
# BOUND, NOT AGGREGATED, because of how admin identity is actually wired. On 057 the portal chart binds
# the `admins` group to cluster-admin (ClusterRoleBinding cluster-admin-binding-krateo-system), and the
# admin user's authn record carries groups: [admins]. The `aggregate-to-admin` label only reaches the
# built-in `admin` ClusterRole, which nothing binds to a Krateo group there — so an aggregated rule
# would reach no portal admin, and would quietly grant this to every namespace admin instead. A direct
# ClusterRoleBinding to the group names exactly who is meant, and it keeps working if the portal ever
# narrows its cluster-admin binding, which is the change that would otherwise break this silently.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nightly-review.fullname" . }}-portal-admin
rules:
  - apiGroups: ["review.krateo.io"]
    resources: ["proposals", "reviewruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["review.krateo.io"]
    resources: ["proposals"]
    verbs: ["get", "patch"]
  - apiGroups: ["review.krateo.io"]
    resources: ["proposals/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nightly-review.fullname" . }}-portal-admin
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "nightly-review.fullname" . }}-portal-admin }
subjects:
  {{- range .Values.portalAdminAccess.groups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . | quote }}
  {{- end }}
{{- end }}
