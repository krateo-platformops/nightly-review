# ---------------------------------------------------------------------------------------------
# THIS COMPONENT SHIPS INERT, AND THAT IS DELIBERATE.
#
# `dryRun: true` means a fresh install reviews the platform, writes Proposal objects you can read, and
# opens nothing. ONE switch has to be thrown on purpose before it can touch a repository. A thing that
# opens pull requests against production repositories on the night it is installed, before anyone has
# seen the quality of its reasoning, has earned no such trust.
#
# There used to be a second switch, an allowlist of permitted repositories per proposal kind. It was
# removed on purpose: it existed to bound a GitHub write credential this service no longer holds, and
# it blocked proposals before they could become pull requests — which is where a human reads them and
# where the accept/reject signal comes from. See proposals.py for the full reasoning.
# ---------------------------------------------------------------------------------------------
schedule: "0 2 * * *"          # nightly, after the quiet hours
windowHours: 24                # BOUNDED: spans older than the collector's JWT redaction can still
                               # carry live credentials, so the window is a safety control, not a cost one
dryRun: true                   # produce Proposals, open NO pull requests
suspend: false

image:
  repository: ghcr.io/krateo-platformops/nightly-review
  tag: ""                      # empty -> defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

retention:
  runDays: 30                  # ReviewRun is an event; prune it
  decidedProposalDays: 180     # a DECIDED proposal is an audit record; keep it a long time
                               # an OPEN proposal is never collected — it is an undecided question

# The evidence queries, as configuration rather than code, so they are reviewable and adaptable to your
# ClickHouse schema without a new image. `{from}` and `{to}` are substituted; nothing else is.
# A model is never asked to author SQL against a store that has held credentials.
clickhouseQueries: {}
  # errorsByService: |
  #   SELECT ServiceName, count() AS n, any(Body) AS sample
  #   FROM otel_logs WHERE Timestamp BETWEEN '{from}' AND '{to}' AND SeverityText IN ('ERROR','FATAL')
  #   GROUP BY ServiceName ORDER BY n DESC LIMIT 25

# WHO DOES THE REVIEWING. A dedicated agent holding NO TOOLS — see templates/agent.yaml for why that
# is the point rather than an economy. Set `create: false` to bring your own via config.reviewerA2aUrl.
reviewer:
  create: true
  name: nightly-review-agent
  modelConfig: gemini-flash    # must name a kagent ModelConfig in this namespace

config:
  authnUrl: ""                 # enables the SA -> Krateo JWT exchange; required for kagent sessions
  reviewerA2aUrl: ""           # empty -> the agent this chart creates. Set it to point elsewhere.
  autopilotA2aUrl: ""          # DEPRECATED alias for reviewerA2aUrl, honoured so existing values files
                               # keep working. Asking an ORCHESTRATOR to review is what this release
                               # stops doing; see templates/agent.yaml.
  kagentApiUrl: http://kagent-controller.krateo-system.svc:8083
  clickhouseUrl: ""
  evidenceMaxChars: 60000
  # TWO CLOCKS. a2aTimeoutSeconds is the TOTAL budget for one question and bounds the run; the read
  # timeout only bounds SILENCE between streamed events. Conflating them is how a chatty runaway task
  # stayed unbounded: it never went quiet, so it never timed out.
  a2aTimeoutSeconds: 900
  a2aReadTimeoutSeconds: 180

# Credentials are referenced, never inlined.
secrets:
  # NO GITHUB TOKEN. Publishing goes through the platform's own chain (Repository -> Repo ->
  # LocalResource -> PullRequest), so the credential that reaches a repository is git-provider's,
  # configured once at install level and shared with portal-builder and blueprint-builder. This service
  # only asks, by creating a BuilderPublish claim.
  clickhouse: { name: "", userKey: username, passwordKey: password }

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 1Gi }
