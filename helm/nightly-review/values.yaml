# ---------------------------------------------------------------------------------------------
# THIS COMPONENT SHIPS INERT, AND THAT IS DELIBERATE.
#
# `dryRun: true` and an EMPTY `proposalAllowlist` mean a fresh install reviews the platform, writes
# Proposal objects you can read, and opens nothing. Two switches have to be thrown on purpose before it
# can touch a repository. A thing that opens pull requests against production repositories on the night
# it is installed, before anyone has seen the quality of its reasoning, has earned no such trust.
# ---------------------------------------------------------------------------------------------
schedule: "0 2 * * *"          # nightly, after the quiet hours
windowHours: 24                # BOUNDED: spans older than the collector's JWT redaction can still
                               # carry live credentials, so the window is a safety control, not a cost one
dryRun: true                   # produce Proposals, open NO pull requests
suspend: false

image:
  repository: ghcr.io/krateo-platformops/nightly-review
  tag: ""                      # empty -> defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

retention:
  runDays: 30                  # ReviewRun is an event; prune it
  decidedProposalDays: 180     # a DECIDED proposal is an audit record; keep it a long time
                               # an OPEN proposal is never collected — it is an undecided question

# Which repositories each proposal kind may target. EMPTY MEANS DENY ALL.
# `target.repo` is chosen by the model from a corpus that includes user-written chat text, so without
# this list one sentence in a conversation could aim this service's write credential wherever it liked.
# A proposal naming anything outside the list is refused, never redirected, and the refusal is recorded
# on the run as a possible injection signal.
proposalAllowlist: {}
  # Alert:         ["krateo-platformops/krateo-observability"]
  # Widget:        ["krateo-blueprints/portal-pages"]
  # Prompt:        ["krateo-agentiko/autopilot"]
  # Policy:        ["krateo-agentiko/agentgateway-policies"]
  # Documentation: ["krateo-platformops/installer"]

# The evidence queries, as configuration rather than code, so they are reviewable and adaptable to your
# ClickHouse schema without a new image. `{from}` and `{to}` are substituted; nothing else is.
# A model is never asked to author SQL against a store that has held credentials.
#
# THESE DEFAULTS ARE WRITTEN FOR THE SCHEMA KRATEO ACTUALLY WRITES, not the one the OTel docs imply.
# Grounded in the deployed collector config (database `default`, logs_table_name `otel_logs`) and in
# two facts that trip everyone who writes these from memory:
#   * SeverityText IS ALWAYS EMPTY here. Severity travels in the text. A query filtering
#     SeverityText IN ('ERROR','FATAL') returns nothing, forever, and looks like a quiet platform.
#   * Kubernetes events are distinguished by ResourceAttributes['telemetry.source'] = 'k8s-events',
#     with the event itself as JSON in Body; container logs carry '' there.
#
# They AGGREGATE rather than return rows. The model is being asked for judgement about patterns, and
# counts are both far cheaper in context and far less likely to carry a credential out of a log line
# than raw Body text would be.
clickhouseQueries:
  errorPatternsByService: |
    SELECT ServiceName,
           ResourceAttributes['k8s.namespace.name'] AS ns,
           count() AS n
    FROM otel_logs
    WHERE Timestamp BETWEEN '{from}' AND '{to}'
      AND ResourceAttributes['telemetry.source'] = ''
      AND (position(Body, 'ERROR') > 0 OR position(Body, 'error') > 0
           OR position(Body, 'Failed') > 0 OR position(Body, 'panic') > 0)
    GROUP BY ServiceName, ns
    ORDER BY n DESC
    LIMIT 25

  kubernetesEventReasons: |
    SELECT JSONExtractString(Body, 'object', 'reason')  AS reason,
           JSONExtractString(Body, 'object', 'kind')    AS kind,
           count() AS n
    FROM otel_logs
    WHERE Timestamp BETWEEN '{from}' AND '{to}'
      AND ResourceAttributes['telemetry.source'] = 'k8s-events'
      AND reason != ''
    GROUP BY reason, kind
    ORDER BY n DESC
    LIMIT 25

  logVolumeByService: |
    SELECT ServiceName, count() AS n
    FROM otel_logs
    WHERE Timestamp BETWEEN '{from}' AND '{to}'
    GROUP BY ServiceName
    ORDER BY n DESC
    LIMIT 25

config:
  authnUrl: ""                 # enables the SA -> Krateo JWT exchange; required for kagent sessions
  autopilotA2aUrl: http://krateo-autopilot.krateo-system.svc:8080/
  kagentApiUrl: http://kagent-controller.krateo-system.svc:8083
  clickhouseUrl: ""
  evidenceMaxChars: 60000

# Credentials are referenced, never inlined.
secrets:
  github: { name: "", key: token }          # PR creation; needs contents+pull-requests write on the
                                            # allowlisted repos ONLY
  clickhouse: { name: "", userKey: username, passwordKey: password }

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 1Gi }
