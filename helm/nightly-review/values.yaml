# ---------------------------------------------------------------------------------------------
# THIS COMPONENT SHIPS INERT, AND THAT IS DELIBERATE.
#
# `dryRun: true` means a fresh install reviews the platform, writes Proposal objects you can read, and
# opens nothing. ONE switch has to be thrown on purpose before it can touch a repository. A thing that
# opens pull requests against production repositories on the night it is installed, before anyone has
# seen the quality of its reasoning, has earned no such trust.
#
# There used to be a second switch, an allowlist of permitted repositories per proposal kind. It was
# removed on purpose: it existed to bound a GitHub write credential this service no longer holds, and
# it blocked proposals before they could become pull requests — which is where a human reads them and
# where the accept/reject signal comes from. See proposals.py for the full reasoning.
# ---------------------------------------------------------------------------------------------
schedule: "0 2 * * *"          # nightly, after the quiet hours
windowHours: 24                # BOUNDED: spans older than the collector's JWT redaction can still
                               # carry live credentials, so the window is a safety control, not a cost one
dryRun: true                   # produce Proposals, open NO pull requests
suspend: false

image:
  repository: ghcr.io/krateo-platformops/nightly-review
  tag: ""                      # empty -> defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

retention:
  runDays: 30                  # ReviewRun is an event; prune it
  decidedProposalDays: 180     # a DECIDED proposal is an audit record; keep it a long time
                               # an OPEN proposal is never collected — it is an undecided question

# The evidence queries, as configuration rather than code, so they are reviewable and adaptable to your
# ClickHouse schema without a new image. `{from}` and `{to}` are substituted; nothing else is. They
# arrive as 'YYYY-MM-DD HH:MM:SS' in UTC, not ISO-8601: ClickHouse cannot range-prune a DateTime64
# against an ISO literal, and on 057 that was the difference between 2.3s and a 120s timeout (#23).
# A query without both placeholders is refused, not run.
# A model is never asked to author SQL against a store that has held credentials.
#
# THESE DEFAULTS ARE WRITTEN FOR THE SCHEMA KRATEO ACTUALLY WRITES (database `default`, table
# `otel_logs`), and they replace an example that could never have returned a row: it filtered
# SeverityText IN ('ERROR','FATAL'), and SeverityText is ALWAYS EMPTY on this platform — severity
# travels in the text. Anyone who enabled it got zero rows forever and a platform that looked healthy.
#   * Container logs carry ResourceAttributes['telemetry.source'] = ''; Kubernetes events carry
#     'k8s-events', with the event itself as JSON in Body.
#   * They AGGREGATE rather than return rows. The model is asked for judgement about patterns, and
#     counts are far cheaper in context and far less likely to carry a credential out of a log line
#     than raw Body text.
# Helm MERGES maps: a key you set replaces the default of the same name, and a default you do not
# want is removed by setting it to null.
clickhouseQueries:
  errorPatternsByService: |
    SELECT ServiceName,
           ResourceAttributes['k8s.namespace.name'] AS ns,
           count() AS n
    FROM otel_logs
    WHERE Timestamp BETWEEN '{from}' AND '{to}'
      AND ResourceAttributes['telemetry.source'] = ''
      AND (position(Body, 'ERROR') > 0 OR position(Body, 'error') > 0
           OR position(Body, 'Failed') > 0 OR position(Body, 'panic') > 0)
    GROUP BY ServiceName, ns
    ORDER BY n DESC
    LIMIT 25
  kubernetesEventReasons: |
    SELECT JSONExtractString(Body, 'object', 'reason') AS reason,
           JSONExtractString(Body, 'object', 'kind')   AS kind,
           count() AS n
    FROM otel_logs
    WHERE Timestamp BETWEEN '{from}' AND '{to}'
      AND ResourceAttributes['telemetry.source'] = 'k8s-events'
      AND reason != ''
    GROUP BY reason, kind
    ORDER BY n DESC
    LIMIT 25
  logVolumeByService: |
    SELECT ServiceName, count() AS n
    FROM otel_logs
    WHERE Timestamp BETWEEN '{from}' AND '{to}'
    GROUP BY ServiceName
    ORDER BY n DESC
    LIMIT 25

# WHO DOES THE REVIEWING. A dedicated agent holding NO TOOLS — see templates/agent.yaml for why that
# is the point rather than an economy. Set `create: false` to bring your own via config.reviewerA2aUrl.
reviewer:
  create: true
  name: nightly-review-agent
  modelConfig: gemini-flash    # must name a kagent ModelConfig in this namespace

config:
  authnUrl: ""                 # enables the SA -> Krateo JWT exchange; required for kagent sessions
  reviewerA2aUrl: ""           # empty -> the agent this chart creates. Set it to point elsewhere.
  autopilotA2aUrl: ""          # DEPRECATED alias for reviewerA2aUrl, honoured so existing values files
                               # keep working. Asking an ORCHESTRATOR to review is what this release
                               # stops doing; see templates/agent.yaml.
  kagentApiUrl: http://kagent-controller.krateo-system.svc:8083
  # Reached in-cluster; never through the gateway, because this is a database connection and not an
  # API call that per-user RBAC could be applied to.
  kagentDbHost: kagent-postgresql.krateo-system.svc
  kagentDbPort: 5432
  kagentDbName: kagent
  # WHAT PEOPLE ASKED. The text of USER-AUTHORED messages (never agent replies or tool output) from
  # sessions active in the window, redacted before it reaches the prompt. All-users, like the metadata,
  # so the role in secrets.kagentDb needs SELECT on `event` as well as `session`. Bounded per session
  # and in total; a cut is recorded on the run (truncated, droppedMessages, droppedSessions).
  # maxSessions: 0 turns the read off.
  kagentQuestions:
    maxSessions: 40
    maxMessagesPerSession: 6
    maxCharsPerSession: 1500
  # WHAT THE AGENTS DID. Between gather and ask, ONE model call per agent that had conversations in the
  # window, over those conversations IN FULL — questions, agent replies, tool calls and tool results —
  # and the agent's current prompt (its Agent's systemMessage, with promptTemplate include()s resolved
  # from the ConfigMaps it names). Only each call's bounded ASSESSMENT reaches the main review, never a
  # transcript; the budget here is separate from evidenceMaxChars. Everything is redacted per message
  # before any cut. Uses the same reviewer and the same secrets.kagentDb role (SELECT on `event` already
  # covers replies). Every cut is recorded on the run. maxAgents: 0 turns the stage off.
  agentAnalysis:
    maxAgents: 8                 # most-used agents first; the rest are recorded as skipped
    maxSessionsPerAgent: 20      # most recently active first
    maxMessagesPerSession: 40    # stored events: the first half and the last half; the middle gives way
    maxCharsPerAgent: 80000      # the conversations shown for one agent, after every per-message cut
    maxCharsPerMessage: 2000     # a question, a reply, an error
    maxToolResultChars: 800      # HARD: tool results are the bulk
    maxToolArgsChars: 400
    maxPromptChars: 60000        # autopilot's resolved prompt is ~49k on 057
    maxEventChars: 262144        # a stored event larger than this is not fetched at all
    timeoutSeconds: 300          # one agent's call, total
    totalSeconds: 1500           # the whole stage; agents not reached are recorded
    corpusMaxChars: 16000        # what the assessments may add to the main review
    # Globs over "namespace/name" or "name". The reviewer agent this chart creates is always excluded.
    # Benchmark agents belong here: their traffic is a harness's, and product prompts must not be
    # tuned from it.
    excludeAgents: ["*-bench"]
    # ConfigMaps the prompt includes may be read from, by name, in this release's namespace. Empty
    # grants `get` on ConfigMaps in the namespace (never `list`, never another namespace, never
    # Secrets); naming them narrows the grant to exactly those.
    promptConfigMaps: []
  clickhouseUrl: ""
  evidenceMaxChars: 60000
  # TWO CLOCKS. a2aTimeoutSeconds is the TOTAL budget for one question and bounds the run; the read
  # timeout only bounds SILENCE between streamed events. Conflating them is how a chatty runaway task
  # stayed unbounded: it never went quiet, so it never timed out.
  a2aTimeoutSeconds: 900
  a2aReadTimeoutSeconds: 180
  # Whether a proposal's target.repo exists is asked here, ANONYMOUSLY — this service holds no git
  # credential and is not given one for this. A private repository answers 404 like a missing one; the
  # TargetResolved condition says so. Empty disables the check (TargetResolved=Unknown/CheckDisabled).
  targetCheckApiUrl: https://api.github.com

# Credentials are referenced, never inlined.
secrets:
  # NO GITHUB TOKEN. Publishing goes through the platform's own chain (Repository -> Repo ->
  # LocalResource -> PullRequest), so the credential that reaches a repository is git-provider's,
  # configured once at install level and shared with portal-builder and blueprint-builder. This service
  # only asks, by creating a BuilderPublish claim.
  clickhouse: { name: "", userKey: username, passwordKey: password }

  # kagent's Postgres, read across every user: session METADATA, and the text of user-authored messages
  # (config.kagentQuestions). The role named here is expected to hold SELECT on `session` and `event` and
  # nothing else; it stays REVOKEd on `task`. `event` also holds agent replies and tool output, which the
  # query leaves out and the code re-checks — the grant cannot draw that line, so it is drawn twice in
  # code instead. Verify the grant where the role is created (session=t, event=t, task=f) rather than
  # trusting these keys. A role still revoked on `event` keeps the metadata working and makes the run
  # PartiallyCompleted with the permission error, rather than a quiet night. Empty name => the source reports not-configured and the run is PartiallyCompleted, which
  # is the honest state rather than a silent skip.
  kagentDb:
    name: ""
    userKey: username
    passwordKey: password
# WHO MAY ACT ON A PROPOSAL FROM THE PORTAL: read Proposals and ReviewRuns, patch a Proposal (to record
# spec.decision — decisionPolicy below keeps it to that) and write its status. `admins` is the group Krateo's
# authn gives its admin users; see templates/rbac.yaml for why this is a binding and not an aggregation.
portalAdminAccess:
  enabled: true
  groups: [admins]

# WHAT THAT PATCH MAY CHANGE. The portal records a decision by patching the Proposal itself (spec.decision),
# and RBAC cannot narrow a patch to one field — so a ValidatingAdmissionPolicy refuses any other spec
# change from anyone but this service, and a MutatingAdmissionPolicy stamps decidedBy/decidedAt from the
# request so the portal cannot forge who decided. See templates/decision-policy.yaml. Turning this off
# leaves every admin able to rewrite a proposal's evidence and change.
decisionPolicy:
  enabled: true

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 1Gi }
